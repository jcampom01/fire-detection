name: fire-mlops

services:
  # --- Metadata store: runs, params, metrics, model versions, aliases ---
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No ports: only reachable from inside the compose network

  # --- Artifact store (S3 API): models, meta.json, plots, predictions ---
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_OBS_LOG_DIRECTORY: ""  # log to stdout
    volumes:
      - rustfs_data:/data
    ports:
      - "127.0.0.1:9001:9001"  # web console, only from this machine
    ulimits:
      nofile: 65536
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Tracking server + model registry (stateless: data lives in postgres + rustfs) ---
  # Requires the bucket: run scripts/create_bucket.sh once
  mlflow:
    build: ./mlflow
    image: fire-mlops/mlflow:3.17.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*"
    command:
      - mlflow
      - server
      - --backend-store-uri=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - --artifacts-destination=s3://${MLFLOW_BUCKET}
      - --serve-artifacts
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
    ports:
      - "127.0.0.1:5000:5000"  # UI + API, only from this machine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --- DB web UI (optional): docker compose --profile tools up -d adminer ---
  adminer:
    image: adminer:6.2.0
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "127.0.0.1:8081:8080"  # web UI, only from this machine

volumes:
  postgres_data:
  rustfs_data:
